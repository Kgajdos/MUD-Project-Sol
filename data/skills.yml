# data/skills.yml
# Authoritative skill registry for Project Sol.
#
# Each top-level key is a skill identifier (snake_case). Values are metadata
# used by chargen, UI and game systems. Add new skills here and (optionally)
# call the reload helper in-game or restart the server to pick up changes.
#
# Fields:
#   label: human-readable name
#   selectable: whether the skill is offered at character creation
#   category: arbitrary grouping for UI/filters
#   xp_required: XP required for the first level-up (integer)
#   description: short description shown in UIs or tooltips

cooking:
  label: "Cooking"
  selectable: true
  category: "life"
  xp_required: 100
  description: "Preparing food, rations and recipes."

